[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lpstools"
version = "0.1"
description = "Loco positioning tools"
license = { text = "MIT" }
authors = [{ name = "Bitcraze", email = "contact@bitcraze.io" }]
requires-python = ">=3.8"
dependencies = ["pyusb~=1.0.2", "pyserial~=3.4"]

[project.optional-dependencies]
pyqt5 = ["pyqt5~=5.15"]

[project.urls]
Homepage = "https://github.com/bitcraze/lps-tools"

[project.gui-scripts]
lps-tools = "lpstools.gui:main"

[dependency-groups]
dev = ["coverage", "mock", "pre-commit", "flake8"]

[tool.setuptools]
packages = ["lpstools", "dfuse"]
zip-safe = false

[tool.setuptools.package-data]
lpstools = ["assets/*"]
